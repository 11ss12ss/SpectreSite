<style>
:root { --bg:#07060E; --ink:#EEE9F8; --muted:#ADA7C6; --faint:#7B7899; --accent:#FF5CD1; --cyan:#5FE3F0; --blue:#7B6BFF; --rose:#FF9FB0; --ok:#6EE7A8; --warn:#FFC857;
  --line:rgba(190,175,255,.2); --soft:rgba(190,175,255,.07); --card:rgba(24,18,46,.72); color-scheme:dark;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg) radial-gradient(90% 60% at 50% 0%,#1B1233 0%,#09070F 60%,#040309 100%) fixed; color:var(--ink); font:400 16px/1.6 var(--font);
  padding:0 max(18px,env(safe-area-inset-right,0px)) 90px max(18px,env(safe-area-inset-left,0px)); overflow-x:hidden; min-height:100vh; }
a { color:var(--ink); text-decoration-color:var(--accent); text-underline-offset:4px; }
a:hover { color:var(--accent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
.glow { position:fixed; border-radius:50%; filter:blur(130px); z-index:0; pointer-events:none; opacity:.3; }
.g1 { width:640px; height:640px; left:-240px; top:-200px; background:#FF4FD0; }
.g2 { width:600px; height:600px; right:-260px; bottom:60px; background:#4B5BFF; opacity:.26; }
.wrap { max-width:1000px; margin:0 auto; position:relative; z-index:1; }
header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:22px 0; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; font:700 1.2rem/1 var(--font); text-decoration:none; }
.brand img { height:34px; width:auto; mix-blend-mode:screen; }
.brand small { font:500 .75rem/1 var(--font); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:5px 9px; margin-left:4px; }
.me { display:flex; align-items:center; gap:10px; font-size:.92rem; color:var(--muted); }
.me img { width:30px; height:30px; border-radius:50%; }
button, .btn { font:600 .92rem/1 var(--font); cursor:pointer; border-radius:99px; border:1px solid var(--line); background:var(--soft); color:var(--ink); padding:11px 18px; text-decoration:none; display:inline-block; }
button:hover, .btn:hover { border-color:var(--accent); color:var(--ink); }
.primary { background:linear-gradient(100deg,#FF5CD1,#6B5BFF 60%,#3DB8FF); border:0; color:#fff; box-shadow:0 8px 34px rgba(150,80,255,.4); font-weight:700; }
.primary:hover { filter:brightness(1.1); }
button[disabled] { opacity:.45; cursor:not-allowed; }
h1 { font:800 clamp(2rem,6vw,3rem)/1.05 var(--font); letter-spacing:-.03em; margin:8px 0 10px; }
h2 { font:700 1.25rem/1.2 var(--font); margin:0 0 14px; letter-spacing:-.01em; }
h3 { font:600 .8rem/1 var(--font); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
.muted { color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; backdrop-filter:blur(8px); }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
.sv { display:flex; align-items:center; gap:14px; text-decoration:none; padding:16px; cursor:pointer; text-align:left; width:100%; border-radius:18px; border:1px solid var(--line); background:var(--card); }
.sv:hover { border-color:var(--accent); }
.sv .ic { width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#FF5CD1,#4FD3FF); flex:none; object-fit:cover; display:grid; place-items:center; font-weight:800; color:#fff; }
.sv b { display:block; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
.sv span { font-size:.85rem; color:var(--muted); }
.hero { padding:50px 0 30px; max-width:36em; }
.hero p { font-size:1.12rem; color:var(--muted); }
.banner { border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin:0 0 18px; background:var(--soft); }
.banner.err { border-color:rgba(255,120,140,.55); background:rgba(255,90,120,.1); }
.banner.ok { border-color:rgba(110,231,168,.5); background:rgba(110,231,168,.08); }
.top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.top .ic { width:52px; height:52px; border-radius:16px; object-fit:cover; background:linear-gradient(135deg,#FF5CD1,#4FD3FF); }
.back { font-size:.9rem; color:var(--muted); }
.tabs { display:flex; gap:6px; margin:0 0 22px; border-bottom:1px solid var(--line); overflow-x:auto; }
.tabs button { border:0; border-radius:10px 10px 0 0; background:none; color:var(--muted); padding:12px 16px; border-bottom:2px solid transparent; }
.tabs button[aria-selected=true] { color:var(--ink); border-bottom-color:var(--accent); }
.tiles { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); margin-bottom:18px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
.tile b { display:block; font:800 1.7rem/1.1 var(--font); letter-spacing:-.02em; }
.tile span { font-size:.82rem; color:var(--muted); }
.pill { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:99px; padding:6px 12px; font-size:.88rem; }
.pill i { width:9px; height:9px; border-radius:50%; background:var(--faint); display:inline-block; }
.pill.on i { background:var(--warn); box-shadow:0 0 10px var(--warn); }
.pill.good i { background:var(--ok); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.charts { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr)); }
svg.ch { width:100%; height:auto; display:block; }
svg.ch text { fill:var(--faint); font:500 10px var(--font); }
svg.ch .gl { stroke:var(--line); stroke-width:1; }
.legend { display:flex; gap:16px; font-size:.85rem; color:var(--muted); margin-bottom:8px; flex-wrap:wrap; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
ul.rank { list-style:none; margin:0; padding:0; }
ul.rank li { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); }
ul.rank li:last-child { border:0; }
ul.rank .bar { height:5px; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--cyan)); margin-top:6px; }
select, input[type=number], input[type=text], textarea { width:100%; background:rgba(8,6,18,.6); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font:400 .95rem var(--font); }
textarea { min-height:78px; resize:vertical; }
select:focus, input:focus, textarea:focus { outline:none; border-color:var(--accent); }
details.grp { border:1px solid var(--line); border-radius:16px; margin-bottom:12px; background:var(--card); }
details.grp > summary { cursor:pointer; padding:16px 20px; font:700 1rem var(--font); list-style:none; display:flex; justify-content:space-between; }
details.grp > summary::-webkit-details-marker { display:none; }
details.grp > summary::after { content:"+"; color:var(--accent); }
details.grp[open] > summary::after { content:"–"; }
.set { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,260px); gap:8px 22px; padding:14px 20px; border-top:1px dashed var(--line); align-items:center; }
.set label { font:600 .92rem var(--font); display:block; }
.set .k { font:400 .74rem var(--mono); color:var(--faint); }
.set p { margin:3px 0 0; font-size:.86rem; color:var(--muted); line-height:1.45; }
.set.dirty { background:rgba(255,92,209,.07); }
@media (max-width:640px) { .set { grid-template-columns:1fr; } }
.sw { position:relative; width:46px; height:26px; display:inline-block; justify-self:end; }
.sw input { opacity:0; width:100%; height:100%; margin:0; position:absolute; inset:0; cursor:pointer; z-index:1; }
.sw span { position:absolute; inset:0; border-radius:99px; background:#2A2540; border:1px solid var(--line); transition:.15s; }
.sw span::after { content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.15s; }
.sw input:checked + span { background:linear-gradient(100deg,#FF5CD1,#6B5BFF); border-color:transparent; }
.sw input:checked + span::after { transform:translateX(20px); }
.sw input:focus-visible + span { outline:2px solid var(--accent); outline-offset:3px; }
.save { position:sticky; bottom:16px; margin-top:18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px; border-radius:18px; border:1px solid var(--accent); background:rgba(20,14,40,.94); box-shadow:0 10px 40px rgba(0,0,0,.5); z-index:5; }
.drow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 16px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:10px; }
.drow .nm { font-weight:700; overflow-wrap:anywhere; }
.drow .meta { font-size:.82rem; color:var(--muted); overflow-wrap:anywhere; }
.badge { display:inline-block; font:600 .68rem/1 var(--font); letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line); border-radius:99px; padding:4px 8px; margin-left:8px; color:var(--muted); vertical-align:2px; }
.badge.red { border-color:rgba(255,120,140,.6); color:#FFB3BF; }
button.danger { border-color:rgba(255,120,140,.55); color:#FFB3BF; }
button.danger:hover { background:rgba(255,90,120,.12); border-color:rgba(255,120,140,.8); }
.devbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border:1px solid rgba(255,200,87,.5); background:rgba(255,200,87,.07); border-radius:14px; padding:10px 16px; margin-bottom:18px; font-size:.9rem; }
.field { display:block; margin:0 0 14px; }
.field > span { display:block; font:600 .85rem var(--font); margin-bottom:6px; }
.chk { display:flex; gap:10px; align-items:flex-start; margin:0 0 10px; font-size:.92rem; }
.chk input { margin-top:4px; }
@media (max-width:640px) { .drow { grid-template-columns:1fr; } }
.skel { color:var(--faint); padding:40px 0; text-align:center; }
footer { margin-top:60px; padding-top:20px; border-top:1px dashed var(--line); color:var(--faint); font-size:.88rem; }
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .sw span, .sw span::after { transition:none; } }
</style>
</head>

<script>
"use strict";
const API = "https://api.spectrebot.org";        /* where the bot's dashboard server lives */
const app = document.getElementById("app"), meBox = document.getElementById("me");
let me = null, isOwner = false, devUnlocked = false, devTimer = null;

/* tiny safe DOM builder: all data goes in as text, never as HTML */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const add = (box, ...kids) => { for (const k of kids.flat(Infinity)) if (k != null && k !== false) box.append(k); return box; };
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const num = (n) => Number(n || 0).toLocaleString();
const plain = (s) => String(s).replace(/`/g, "");

async function api(path, opt = {}) {
  let r;
  try {
    r = await fetch(API + path, { credentials: "include", ...opt, headers: opt.body ? { "Content-Type": "application/json" } : {} });
  } catch (e) { throw { status: 0, message: "Can't reach the dashboard server right now." }; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw { status: r.status, message: j.error || "Something went wrong." };
  return j;
}

function banner(kind, text) { return h("div", { class: "banner " + kind, role: kind === "err" ? "alert" : "status" }, text); }
function setApp(...nodes) { clear(app).append(...nodes.flat().filter(Boolean)); window.scrollTo(0, 0); }

/* ---------------------------------------------------------------- login / errors */
function viewLogin(note) {
  clear(meBox);
  setApp(note, h("div", { class: "hero" },
    h("h1", null, "Run Spectre from here."),
    h("p", null, "Log in with Discord to see your server's analytics and change Spectre's settings without typing a command. You'll only see servers where you have Manage Server and Spectre is present."),
    h("p", { class: "muted", style: "font-size:.95rem" }, "We only ask Discord who you are (your name and avatar). Nothing else."),
    h("a", { class: "btn primary", href: API + "/auth/login" }, "Log in with Discord")));
}
function viewOffline(msg) {
  setApp(h("div", { class: "hero" }, h("h1", null, "Dashboard unavailable"), banner("err", msg),
    h("p", { class: "muted" }, "The bot's dashboard server isn't reachable. If you run Spectre, check that it's online and the dashboard is switched on. Otherwise try again in a minute."),
    h("button", { onclick: () => start() }, "Try again")));
}
const LOGIN_ERRORS = { denied: "You cancelled the Discord login.", state: "That login link expired. Please try again.", login: "Discord login failed. Please try again." };

/* ---------------------------------------------------------------- server picker */
function viewServers(guilds) {
  if (location.hash !== "#/") history.replaceState(null, "", "#/");
  showMe();
  if (!guilds.length) {
    setApp(h("h1", null, "Your servers"), h("div", { class: "card" },
      h("p", null, "No servers found."),
      h("p", { class: "muted" }, "You need the Manage Server permission in a server that has Spectre. Add Spectre to your server first (the invite is in the support Discord), then come back.")));
    return;
  }
  setApp(h("h1", null, "Your servers"), h("p", { class: "muted" }, "Pick a server to manage."),
    h("div", { class: "grid" }, guilds.map((g) => h("a", { class: "sv", href: "#/g/" + g.id + "/overview" },
      g.icon ? h("img", { class: "ic", src: g.icon, alt: "", width: 46, height: 46 }) : h("div", { class: "ic", "aria-hidden": "true" }, (g.name[0] || "?").toUpperCase()),
      h("div", null, h("b", null, g.name), h("span", null, num(g.members) + " members"))))));
}
function showMe() {
  clear(meBox);
  if (!me) return;
  if (me.avatar) meBox.append(h("img", { src: me.avatar, alt: "", width: 30, height: 30 }));
  if (isOwner) meBox.append(h("a", { class: "btn", href: "#/dev" }, "Developer Mode"));
  meBox.append(h("span", null, me.name), h("button", { onclick: logout }, "Log out"));
}
async function logout() { try { await api("/api/logout", { method: "POST", body: "{}" }); } catch (e) {} me = null; isOwner = devUnlocked = false; location.hash = "#/"; viewLogin(); }

/* ---------------------------------------------------------------- server shell + tabs */
const TABS = [["overview", "Overview"], ["analytics", "Analytics"], ["settings", "Settings"]];
let current = null;

async function openGuild(id, tab) {
  tab = TABS.some((t) => t[0] === tab) ? tab : "overview";
  let ov;
  try { ov = await api(`/api/guilds/${id}/overview`); }
  catch (e) { if (e.status === 401) return viewLogin(banner("err", "Your session ended. Please log in again.")); setApp(banner("err", e.message), isOwner && !devUnlocked ? h("p", null, h("a", { href: "#/dev" }, "Unlock Developer Mode"), " to open servers you don't manage.") : null, h("a", { href: "#/" }, "← All servers")); return; }
  current = { id, ov };
  const body = h("div");
  setApp(
    devUnlocked ? h("div", { class: "devbar" }, h("span", null, "Developer Mode is on. Changes you make here are logged to the server's log channel with your name."), h("a", { href: "#/dev" }, "← Back to Developer Mode")) : null,
    h("a", { class: "back", href: devUnlocked ? "#/dev" : "#/" }, devUnlocked ? "← Developer Mode" : "← All servers"),
    h("div", { class: "top", style: "margin-top:10px" },
      ov.icon ? h("img", { class: "ic", src: ov.icon, alt: "", width: 52, height: 52 }) : h("div", { class: "ic", "aria-hidden": "true" }),
      h("div", null, h("h1", { style: "margin:0;font-size:1.8rem" }, ov.name), h("span", { class: "muted" }, num(ov.members) + " members"))),
    h("div", { class: "tabs", role: "tablist" }, TABS.map(([k, label]) =>
      h("button", { role: "tab", "aria-selected": String(k === tab), onclick: () => { location.hash = `#/g/${id}/${k}`; } }, label))),
    body);
  try {
    if (tab === "overview") renderOverview(body, ov);
    else if (tab === "analytics") await renderAnalytics(body, id, 30);
    else await renderSettings(body, id);
  } catch (e) { clear(body).append(banner("err", e.message)); }
}

/* ---------------------------------------------------------------- overview */
function renderOverview(box, ov) {
  const tile = (n, l) => h("div", { class: "tile" }, h("b", null, num(n)), h("span", null, l));
  box.append(
    h("div", { class: "tiles" }, tile(ov.members, "Members"), tile(ov.humans, "People"), tile(ov.bots, "Bots"), tile(ov.text_channels, "Text channels"), tile(ov.roles, "Roles")),
    h("div", { class: "card" }, h("h3", null, "Right now"),
      h("div", { class: "row" },
        h("span", { class: "pill " + (ov.shield_active ? "on" : "good") }, h("i"), ov.shield_active ? "Shield Mode is ON" : "Shield Mode is off"),
        h("span", { class: "pill " + (ov.lockdown_active ? "on" : "good") }, h("i"), ov.lockdown_active ? "Server is in lockdown" : "No lockdown")),
      h("p", { class: "muted", style: "margin:14px 0 0" }, ov.modules_disabled.length
        ? "Switched off in this server: " + ov.modules_disabled.join(", ") + "."
        : "All Spectre modules are switched on.")));
}

/* ---------------------------------------------------------------- analytics */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dayLabel = (d) => { const s = String(d); return MONTHS[+s.slice(4, 6) - 1] + " " + +s.slice(6); };
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); for (const c of kids) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); return e; }

function chart(series, defs, kind) {
  const W = 600, H = 190, L = 34, R = 8, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
  const max = Math.max(1, ...series.flatMap((r) => defs.map((d) => r[d.key])));
  const nice = (() => { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p * 4; })();
  const svg = s("svg", { class: "ch", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": defs.map((d) => d.label).join(" and ") + " per day" });
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - (ih * i) / 4;
    svg.append(s("line", { class: "gl", x1: L, x2: W - R, y1: y, y2: y }), s("text", { x: L - 6, y: y + 3, "text-anchor": "end" }, num(Math.round((nice * i) / 4))));
  }
  const n = series.length, step = iw / n;
  series.forEach((row, i) => {
    if (kind === "bars") {
      const bw = Math.max(1.5, (step * 0.78) / defs.length);
      defs.forEach((d, j) => {
        const v = row[d.key], bh = (v / nice) * ih;
        const r = s("rect", { x: L + i * step + step * 0.11 + j * bw, y: T + ih - bh, width: bw, height: Math.max(bh, v ? 1 : 0), rx: 1.5, fill: d.color });
        r.append(s("title", null, `${dayLabel(row.day)}: ${num(v)} ${d.label.toLowerCase()}`)); svg.append(r);
      });
    }
  });
  if (kind === "area") {
    const d = defs[0], pts = series.map((r, i) => [L + (i + 0.5) * step, T + ih - (r[d.key] / nice) * ih]);
    svg.append(s("path", { d: `M${pts[0][0]},${T + ih} ` + pts.map((p) => `L${p[0]},${p[1]}`).join(" ") + ` L${pts[n - 1][0]},${T + ih} Z`, fill: d.color, opacity: ".18" }),
      s("path", { d: "M" + pts.map((p) => p.join(",")).join(" L"), fill: "none", stroke: d.color, "stroke-width": 2, "stroke-linejoin": "round" }));
    series.forEach((r, i) => { const c = s("circle", { cx: pts[i][0], cy: pts[i][1], r: 7, fill: "transparent" }); c.append(s("title", null, `${dayLabel(r.day)}: ${num(r[d.key])} ${d.label.toLowerCase()}`)); svg.append(c); });
  }
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i) => svg.append(s("text", { x: L + (i + 0.5) * step, y: H - 6, "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle" }, dayLabel(series[i].day))));

}
const legend = (defs) => h("div", { class: "legend" }, defs.map((d) => h("span", null, h("i", { style: "background:" + d.color }), d.label)));

async function renderAnalytics(box, id, days) {
  const data = await api(`/api/guilds/${id}/analytics?days=${days}`);
  const t = data.totals;
  const sel = h("select", { id: "range", "aria-label": "Time range", style: "width:auto", onchange: async () => { clear(box); box.append(h("p", { class: "skel" }, "Loading…")); try { clear(box); await renderAnalytics(box, id, +sel.value); } catch (e) { clear(box).append(banner("err", e.message)); } } },
    [7, 30, 90].map((d) => h("option", { value: d, selected: d === days }, `Last ${d} days`)));
  const J = { key: "joins", label: "Joins", color: "#5FE3F0" }, Lv = { key: "leaves", label: "Leaves", color: "#FF9FB0" },
    M = { key: "messages", label: "Messages", color: "#7B6BFF" }, C = { key: "cases", label: "Moderation actions", color: "#FF5CD1" };
  const tile = (n, l) => h("div", { class: "tile" }, h("b", null, typeof n === "number" ? num(n) : n), h("span", null, l));
  const net = t.joins - t.leaves;
  const rank = (items, label) => items.length
    ? h("ul", { class: "rank" }, items.map((x) => { const top = items[0].count; return h("li", null, h("div", { style: "flex:1;min-width:0" }, h("div", null, plain(label(x))), h("div", { class: "bar", style: `width:${Math.max(4, (x.count / top) * 100)}%` })), h("b", null, num(x.count))); }))
    : h("p", { class: "muted" }, "Nothing yet.");
  add(box,
    h("div", { class: "row", style: "justify-content:space-between;margin-bottom:14px" }, h("h2", { style: "margin:0" }, "Activity"), sel),
    h("div", { class: "tiles" }, tile(t.joins, "Joined"), tile(t.leaves, "Left"), tile((net > 0 ? "+" : "") + net, "Net members"), tile(t.messages, "Messages sent"), tile(t.cases, "Moderation actions")),
    (t.joins + t.leaves + t.messages === 0) ? banner("ok", "Joins, leaves and messages are counted from the day the dashboard was switched on, so these start at zero and fill in over time.") : null,
    h("div", { class: "charts" },
      h("div", { class: "card" }, h("h3", null, "Joins and leaves"), legend([J, Lv]), chart(data.series, [J, Lv], "bars")),
      h("div", { class: "card" }, h("h3", null, "Messages"), legend([M]), chart(data.series, [M], "area")),
      h("div", { class: "card" }, h("h3", null, "Moderation actions"), legend([C]), chart(data.series, [C], "bars")),
      h("div", { class: "card" }, h("h3", null, "What actions were taken"), rank(data.actions, (x) => x.action[0].toUpperCase() + x.action.slice(1))),
      h("div", { class: "card" }, h("h3", null, "Most active moderators"), rank(data.top_moderators, (x) => x.name))),
    h("p", { class: "muted", style: "margin-top:16px;font-size:.88rem" }, "Days are in UTC. Only totals are stored, never message content."));
}

/* ---------------------------------------------------------------- settings */
const GROUPS = [["general", "General"], ["logging", "Logging"], ["antiraid", "Anti-raid and anti-nuke"], ["automod", "Auto-moderation"], ["warnings", "Warnings"],
  ["welcome", "Welcome"], ["verification", "Verification"], ["tickets", "Tickets"], ["appeals", "Appeals"]];
const pretty = (k) => k.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());

async function renderSettings(box, id) {
  const d = await api(`/api/guilds/${id}/settings`);
  const orig = { ...d.values, modules_disabled: [...d.modules_disabled].sort() };
  const cur = JSON.parse(JSON.stringify(orig));
  const rows = new Map();
  const savebar = h("div", { class: "save", hidden: true });
  const same = (k) => JSON.stringify(cur[k]) === JSON.stringify(orig[k]);
  const dirtyKeys = () => Object.keys(cur).filter((k) => !same(k));
  function refresh() {
    const dk = dirtyKeys();
    rows.forEach((el, k) => el.classList.toggle("dirty", !same(k)));
    savebar.hidden = !dk.length;
    clear(savebar).append(h("span", null, dk.length + (dk.length === 1 ? " unsaved change" : " unsaved changes")),
      h("div", { class: "row" }, h("button", { onclick: () => { Object.assign(cur, JSON.parse(JSON.stringify(orig))); renderSettingsInto(); } }, "Discard"),
        h("button", { class: "primary", id: "savebtn", onclick: save }, "Save changes")));
  }
  const msg = h("div");
  async function save() {
    const changes = {}; dirtyKeys().forEach((k) => { changes[k] = cur[k]; });
    const b = document.getElementById("savebtn"); b.disabled = true; b.textContent = "Saving…"; clear(msg);
    try {
      await api(`/api/guilds/${id}/settings`, { method: "PUT", body: JSON.stringify({ changes }) });
      msg.append(banner("ok", "Saved. Spectre is using the new settings now, and a note was posted in your log channel."));
      const fresh = await api(`/api/guilds/${id}/settings`);
      Object.assign(orig, fresh.values, { modules_disabled: [...fresh.modules_disabled].sort() }); Object.assign(cur, JSON.parse(JSON.stringify(orig)));
      renderSettingsInto();
    } catch (e) { msg.append(banner("err", e.message)); const bb = document.getElementById("savebtn"); if (bb) { bb.disabled = false; bb.textContent = "Save changes"; } }
  }
  const options = (kind) => d[kind === "role" ? "roles" : "channels"].filter((c) => kind === "role" || c.kind === kind);
  function control(def) {
    const k = def.key, id_ = "f_" + k;
    if (def.type === "bool") return h("label", { class: "sw" }, h("input", { type: "checkbox", id: id_, checked: !!cur[k], "aria-label": pretty(k), onchange: (e) => { cur[k] = e.target.checked; refresh(); } }), h("span"));
    if (def.type === "int") return h("input", { type: "number", id: id_, value: cur[k], min: def.min, max: def.max, step: 1, oninput: (e) => { cur[k] = e.target.value === "" ? null : Number(e.target.value); refresh(); } });
    if (def.type === "choice") return h("select", { id: id_, onchange: (e) => { cur[k] = e.target.value; refresh(); } }, def.choices.map((c) => h("option", { value: c, selected: c === cur[k] }, c)));
    if (def.type === "str") { const long = k === "welcome_message" || k === "appeal_text"; const el = h(long ? "textarea" : "input", { id: id_, type: "text", maxlength: 500, oninput: (e) => { cur[k] = e.target.value; refresh(); } }); el.value = cur[k] ?? ""; return el; }
    const kind = def.type === "role" ? "role" : (k === "ticket_category" ? "category" : "text");
    return h("select", { id: id_, onchange: (e) => { cur[k] = e.target.value || null; refresh(); } },
      h("option", { value: "" }, "— none —"), options(kind).map((c) => h("option", { value: c.id, selected: c.id === cur[k] }, (kind === "text" ? "# " : "") + c.name)));
  }
  const holder = h("div");
  function renderSettingsInto() {
    rows.clear(); clear(holder);
    const defs = d.schema, byModule = (m) => defs.filter((x) => x.module === m);
    GROUPS.forEach(([m, title], gi) => {
      const list = byModule(m); if (!list.length) return;
      holder.append(h("details", { class: "grp", open: gi === 0 }, h("summary", null, title),
        list.map((def) => { const row = h("div", { class: "set" }, h("div", null, h("label", { for: "f_" + def.key }, pretty(def.key)), h("p", null, plain(def.description)), h("span", { class: "k" }, def.key)), control(def)); rows.set(def.key, row); return row; })));
    });
    const mrow = h("details", { class: "grp" }, h("summary", null, "Modules"),
      d.modules.map((m) => { const row = h("div", { class: "set" }, h("div", null, h("label", { for: "m_" + m.key }, m.name), h("p", null, m.description)),
        h("label", { class: "sw" }, h("input", { type: "checkbox", id: "m_" + m.key, "aria-label": m.name, checked: !cur.modules_disabled.includes(m.key),
          onchange: (e) => { const s_ = new Set(cur.modules_disabled); if (e.target.checked) s_.delete(m.key); else s_.add(m.key); cur.modules_disabled = [...s_].sort(); refresh(); } }), h("span"))); return row; }));
    holder.append(mrow);
    refresh();
  }
  box.append(h("div", { class: "row", style: "justify-content:space-between;margin-bottom:14px" }, h("h2", { style: "margin:0" }, "Settings"),
    h("span", { class: "muted", style: "font-size:.9rem" }, "Same settings as /config. Changes apply instantly.")), msg, holder, savebar);
  renderSettingsInto();
  window.onbeforeunload = () => (dirtyKeys().length ? "You have unsaved changes." : undefined);
}

/* ---------------------------------------------------------------- routing */
/* ---------------------------------------------------------------- Developer Mode (bot owners only) */
const when = (t) => t ? new Date(t * 1000).toLocaleString() : "unknown";
const ownerRight = () => { if (!isOwner) { location.hash = "#/"; return false; } return true; };

function devLockedView(note) {
  const input = h("input", { type: "text", id: "ownerid", inputmode: "numeric", autocomplete: "off", spellcheck: "false", placeholder: "Your Discord user ID", maxlength: 25 });
  const msg = h("div");
  const go = async () => {
    clear(msg);
    try { await api("/api/dev/unlock", { method: "POST", body: JSON.stringify({ owner_id: input.value.trim() }) }); devUnlocked = true; showDevTimer(); viewDev(); }
    catch (e) { msg.append(banner("err", e.status === 403 ? "That didn't unlock. It only works for the bot owners, signed in with their own Discord account." : e.message)); }
  };
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
  setApp(h("a", { class: "back", href: "#/" }, "← All servers"), h("h1", null, "Developer Mode"), note,
    h("div", { class: "card", style: "max-width:560px" },
      h("p", null, "This is for Spectre's owners. You can see every server Spectre is in, open any server's dashboard, and remove the bot from servers that break the rules."),
      h("p", { class: "muted" }, "Unlock it by typing your own Discord user ID. It also checks that you are signed in as a bot owner, so typing someone else's ID won't work. It locks again after 15 minutes."),
      h("label", { class: "field" }, h("span", null, "Owner user ID"), input), msg,
      h("button", { class: "primary", onclick: go }, "Unlock Developer Mode")));
  input.focus();
}
function showDevTimer() { clearTimeout(devTimer); devTimer = setTimeout(() => { devUnlocked = false; if (location.hash === "#/dev") viewDev(); }, 15 * 60 * 1000); }

async function viewDev(tab) {
  if (!ownerRight()) return;
  if (!devUnlocked) return devLockedView();
  tab = tab || "servers";
  const body = h("div");
  const tabBtn = (k, label) => h("button", { role: "tab", "aria-selected": String(k === tab), onclick: () => viewDev(k) }, label);
  setApp(h("a", { class: "back", href: "#/" }, "← All servers"), h("h1", null, "Developer Mode"),
    h("div", { class: "devbar" }, h("span", null, "Unlocked for 15 minutes. Everything here is logged with your name."),
      h("button", { onclick: async () => { try { await api("/api/dev/lock", { method: "POST", body: "{}" }); } catch (e) {} devUnlocked = false; clearTimeout(devTimer); viewDev(); } }, "Lock now")),
    h("div", { class: "tabs", role: "tablist" }, tabBtn("servers", "All servers"), tabBtn("history", "History & blocklist")), body);
  try { if (tab === "servers") await devServers(body); else await devHistory(body); }
  catch (e) { if (e.status === 403) { devUnlocked = false; return devLockedView(banner("err", "Developer Mode locked. Unlock it again.")); } if (e.status === 401) return viewLogin(banner("err", "Your session ended. Please log in again.")); clear(body).append(banner("err", e.message)); }
}

async function devServers(box) {
  const { guilds, reasons } = await api("/api/dev/guilds");
  const q = h("input", { type: "text", placeholder: "Search by name, server ID or owner ID", "aria-label": "Search servers" });
  const list = h("div");
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    const rows = guilds.filter((g) => !t || g.name.toLowerCase().includes(t) || g.id.includes(t) || (g.owner_id || "").includes(t) || (g.owner_name || "").toLowerCase().includes(t));
    clear(list).append(...(rows.length ? rows.map(devRow) : [h("p", { class: "muted" }, "No servers match.")]));
  };
  function devRow(g) {
    const slot = h("div", { style: "grid-column:1/-1" });
    const row = h("div", { class: "drow" },
      h("div", null,
        h("div", { class: "nm" }, g.name, g.blocked ? h("span", { class: "badge red" }, "blocked") : null),
        h("div", { class: "meta" }, `${num(g.members)} members · ID ${g.id} · owner ${g.owner_name ? g.owner_name + " " : ""}(${g.owner_id || "?"}) · Spectre added ${when(g.joined)} · created ${when(g.created)}`)),
      h("div", { class: "row" },
        h("a", { class: "btn", href: `#/g/${g.id}/overview` }, "Open dashboard"),
        h("button", { class: "danger", onclick: () => removeForm(g, slot, row) }, "Remove bot…")),
      slot);
    return row;
  }
  function removeForm(g, slot, row) {
    if (slot.firstChild) return clear(slot);
    const reason = h("select", { id: "rmreason", "aria-label": "Rule broken" },
      h("option", { value: "" }, "Choose the rule it broke…"),
      reasons.map((r) => h("option", { value: r.code }, `${r.label} (Terms §${r.section})`)));
    const note = h("input", { type: "text", maxlength: 200, placeholder: "Optional short note (required for “Other”)", autocomplete: "off" });
    const notify = h("input", { type: "checkbox", checked: true }), block = h("input", { type: "checkbox", checked: true });
    const confirm = h("input", { type: "text", inputmode: "numeric", autocomplete: "off", placeholder: g.id });
    const msg = h("div"), go = h("button", { class: "danger", disabled: true }, "Remove Spectre from this server");
    const ready = () => { go.disabled = !(reason.value && (reason.value !== "other" || note.value.trim().length >= 3) && confirm.value.trim() === g.id); };
    reason.addEventListener("change", ready); note.addEventListener("input", ready); confirm.addEventListener("input", ready);
    go.addEventListener("click", async () => {
      go.disabled = true; clear(msg);
      try {
        const r = await api(`/api/dev/guilds/${g.id}/leave`, { method: "POST", body: JSON.stringify({ reason: reason.value, note: note.value.trim(), notify: notify.checked, block: block.checked, confirm: confirm.value.trim() }) });
        const i = guilds.indexOf(g); if (i >= 0) guilds.splice(i, 1);
        draw(); list.prepend(banner("ok", `Spectre left ${g.name}.` + (r.blocked ? " It's blocked from being added again." : "") + (notify.checked ? (r.notified ? " The server owner was messaged." : " The owner couldn't be messaged (DMs closed).") : "")));
      } catch (e) { msg.append(banner("err", e.message)); ready(); }
    });
    slot.append(h("div", { class: "card", style: "margin-top:4px" },
      h("p", { style: "margin-top:0" }, h("b", null, "Remove Spectre from " + g.name + "?"), " This makes the bot leave right away. Its saved data there is deleted after 30 days like any other leave."),
      h("label", { class: "field" }, h("span", null, "Rule broken (required)"), reason),
      h("label", { class: "field" }, h("span", null, "Note"), note),
      h("label", { class: "chk" }, notify, h("span", null, "Message the server owner (shows the rule and a link to the Terms)")),
      h("label", { class: "chk" }, block, h("span", null, "Block this server so Spectre leaves again if someone re-adds it")),
      h("label", { class: "field" }, h("span", null, "Type the server ID to confirm: " + g.id), confirm), msg, go));
    reason.focus();
  }
  q.addEventListener("input", draw);
  add(box, h("p", { class: "muted" }, `${num(guilds.length)} servers. Open any one to see its analytics and settings, or remove the bot from it.`), h("div", { style: "margin:0 0 16px" }, q), list);
  draw();
}

async function devHistory(box) {
  const d = await api("/api/dev/history");
  const names = {}; 
  add(box, h("h2", null, "Blocked servers"),
    d.blocked.length ? d.blocked.map((b) => {
      const row = h("div", { class: "drow" },
        h("div", null, h("div", { class: "nm" }, "Server " + b.id), h("div", { class: "meta" }, `${b.reason || "No reason saved"} · blocked ${when(b.at)} by ${b.by}`)),
        h("button", { onclick: async () => { row.querySelector("button").disabled = true; try { await api("/api/dev/unblock", { method: "POST", body: JSON.stringify({ guild_id: b.id }) }); row.remove(); } catch (e) { row.append(banner("err", e.message)); } } }, "Unblock"));
      return row; }) : h("p", { class: "muted" }, "Nothing is blocked."),
    h("h2", { style: "margin-top:28px" }, "What's been done"),
    d.actions.length ? d.actions.map((a) => h("div", { class: "drow" },
      h("div", null,
        h("div", { class: "nm" }, (a.action === "removed_bot" ? "Removed from " : a.action === "unblocked" ? "Unblocked " : a.action + " ") + (a.guild_name || a.guild_id)),
        h("div", { class: "meta" }, `${when(a.at)} · by ${a.by_name || a.by}` + (a.reason ? ` · "${a.reason}"` : "") + (a.blocked ? " · blocked" : "") + (a.notified ? " · owner messaged" : ""))))) : h("p", { class: "muted" }, "No actions yet."));
}

async function route() {
  window.onbeforeunload = null;
  if (!me) return;
  const m = location.hash.match(/^#\/g\/(\d+)(?:\/(\w+))?/);
  if (m) return openGuild(m[1], m[2]);
  try {
    const j = await api("/api/me"); isOwner = !!j.is_owner; devUnlocked = !!j.dev_unlocked; showMe();
    if (location.hash === "#/dev") return viewDev();
    viewServers(j.guilds);
  } catch (e) { handleErr(e); }
}
function handleErr(e) {
  if (e.status === 401) viewLogin(); else viewOffline(e.message);
}
async function start() {
  const q = new URLSearchParams(location.search), err = q.get("error");
  if (err) history.replaceState(null, "", location.pathname + location.hash);
  try { const j = await api("/api/me"); me = j.user; isOwner = !!j.is_owner; devUnlocked = !!j.dev_unlocked; showMe(); if (devUnlocked) showDevTimer();
    if (location.hash.startsWith("#/g/") || location.hash === "#/dev") await route(); else viewServers(j.guilds);
  } catch (e) { if (e.status === 401) viewLogin(err ? banner("err", LOGIN_ERRORS[err] || "Login failed.") : null); else viewOffline(e.message); }
}
addEventListener("hashchange", route);
start();
</script>
